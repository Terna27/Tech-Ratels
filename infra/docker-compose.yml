version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ratels_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ratels_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ratels_secure_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ratels_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ratels_user} -d ${POSTGRES_DB:-ratels_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: ratels_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-ratels_user}:${POSTGRES_PASSWORD:-ratels_secure_dev_pass}@postgres:5432/${POSTGRES_DB:-ratels_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev_insecure_jwt_secret_key_change_in_production_32char_min!}
      TZ: Africa/Lagos
      DEV_DELIVERY_SAFE_MODE: "true"
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-false}
      FOUNDATION_PROVISIONAL_NAME: "Martins Vincent Otse Foundation"
    ports:
      - "8000:8000"
    command: >
      sh -c "/app/seed && /app/server"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: ratels_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
