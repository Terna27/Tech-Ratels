name: Production checks
on:
  pull_request:
  push:
    branches: [main, feat/phase69-production-hardening]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ratels_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/ratels_test?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE ratels_migration_audit_db'
      - run: go run ./cmd/migrate
      - run: go run ./cmd/seed
      - run: go test -p 1 ./...
      - name: Store subscription transaction and concurrency tests
        run: go test -race ./internal/subscription -count=1
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/ratels_test?sslmode=disable
      - name: Membership authorization and concurrency race tests
        run: go test -race ./internal/handler -run "^TestPhase71" -count=1
      - run: go vet ./...
      - run: go build ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Store subscription browser acceptance
        run: |
          npm run start -- -p 3008 -H 127.0.0.1 > /tmp/store-subscriptions-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            curl --max-time 2 --fail --silent http://127.0.0.1:3008/marketplace/subscriptions && break
            sleep 0.5
          done
          node --experimental-strip-types --test test/store-subscriptions-browser.test.mjs test/coordinator-browser.test.mjs test/membership-browser.test.mjs
        env:
          TEST_WEB_URL: http://127.0.0.1:3008
          CHROME_BIN: /usr/bin/google-chrome
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml up --build --wait --wait-timeout 180
      - name: Verify frontend proxy and database readiness
        run: |
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://127.0.0.1:3000/api/v1/health
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f infra/docker-compose.yml down
